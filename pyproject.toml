[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ai-field-engineer-assessment"
version = "1.0.0"
description = "Comprehensive implementation and test suite for AI Field Developer / Solutions Engineer Assessment Tasks"
authors = [{ name = "AI Solutions Engineering Candidate" }]
dependencies = [
    "mcp>=2.3.0",
    "pydantic>=2.10.0",
    "fastapi>=0.115.0",
    "uvicorn>=0.34.0",
    "httpx>=0.28.0",
    "aiosqlite>=0.20.0",
    "pyjwt>=2.10.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
]

[tool.hatch.build.targets.wheel]
packages = [
    "task1_mcp_server",
    "task2_security_gateway",
    "task3_streaming_guardrail",
    "task4_resilient_router",
]

[tool.pytest.ini_options]
asyncio_mode = "strict"
asyncio_default_fixture_loop_scope = "function"
testpaths = [
    "task1_mcp_server",
    "task2_security_gateway",
    "task3_streaming_guardrail",
    "task4_resilient_router",
]
